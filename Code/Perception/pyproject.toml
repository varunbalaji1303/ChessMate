[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chessmate-perception"
version = "0.1.0"
description = "Board localization and state perception for ChessMate"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "opencv-contrib-python>=4.8",
  "python-chess>=1.999",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
chess-perception = "chess_perception.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
